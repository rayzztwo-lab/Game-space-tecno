name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan project
        id: p
        run: |
          echo "== isi repo =="
          ls -la
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _work
          done
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "TIDAK ADA settings.gradle.kts. Isi folder:"
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project ditemukan di: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
